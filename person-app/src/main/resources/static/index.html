<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Form</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      font-family: Arial, sans-serif;
      color: #0f172a;
      background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #eef2ff);
    }

    .workspace {
      width: min(100%, 620px);
    }

    .page-heading {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
    }

    .page-description {
      margin: 0 0 28px;
      color: #64748b;
      text-align: center;
    }

    .operation-heading {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .operation-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 6px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      background: #e8eef7;
    }

    .operation-switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .operation-switch label {
      flex: 1;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      color: #475569;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .operation-switch input:checked + label {
      color: #1d4ed8;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    .operation-switch input:focus-visible + label {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .panel {
      display: none;
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .workspace:has(#operation-save:checked) #save-panel,
    .workspace:has(#operation-id:checked) #id-panel,
    .workspace:has(#operation-email:checked) #email-panel,
    .workspace:has(#operation-id:checked) #result-panel,
    .workspace:has(#operation-email:checked) #result-panel {
      display: block;
    }

    .panel h2 {
      margin: 0 0 20px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
      outline: 3px solid rgba(59, 130, 246, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: #2563eb;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      min-height: 24px;
      margin: 16px 0 0;
      color: #166534;
      text-align: center;
    }

    .result {
      min-height: 140px;
      margin-top: 20px;
      padding: 16px;
      overflow-wrap: anywhere;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #f8fafc;
    }

    #lookup-result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 12px;
      }

      .panel {
        padding: 20px;
      }

      .operation-switch label {
        padding: 10px 6px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <h2 class="operation-heading" style="text-align: center;">Select an operation</h2>
    <div class="operation-switch" role="radiogroup" aria-label="Select an operation">
      <input type="radio" id="operation-save" name="operation" value="save" checked>
      <label for="operation-save">Save Person</label>
      <input type="radio" id="operation-id" name="operation" value="id">
      <label for="operation-id">Search by ID</label>
      <input type="radio" id="operation-email" name="operation" value="email">
      <label for="operation-email">Search by Email</label>
    </div>

    <div class="operation-panels">
      <section class="panel" id="save-panel" aria-labelledby="save-heading">
        <form id="contact-form">
          <h2 id="save-heading">Save Person Data</h2>

          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" minlength="2" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phoneno" placeholder="Your phone number" required>

          <button type="submit">Save Data</button>
          <p id="formstatus" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel" id="id-panel" aria-labelledby="id-heading">
        <h2 id="id-heading">Search by ID(autogenerated)</h2>
        <label for="searchId">ID</label>
        <input type="number" id="searchId" placeholder="Enter an ID">
        <button type="button" id="submitid">Find by ID</button>
      </section>

      <section class="panel" id="email-panel" aria-labelledby="email-heading">
        <h2 id="email-heading">Search by Email</h2>
        <label for="searchEmail">Email</label>
        <input type="email" id="searchEmail" placeholder="Enter an email">
        <button type="button" id="submitemail">Find by Email</button>
      </section>

      <section class="panel" id="result-panel" aria-label="Search results">
        <p id="message" class="status" role="status" aria-live="polite"></p>
        <div id="result" class="result" aria-live="polite">Retrieved data will appear here.</div>
      </section>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
